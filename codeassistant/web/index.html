<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CodeAssistant · 多专家代码助手</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f7f8;
    --bg-soft2: #efeff1;
    --border: #e8e8ea;
    --border2: #dcdce0;
    --text: #1f1f1f;
    --text2: #3d3d3d;
    --muted: #9a9aa2;
    --accent: #5b8cff;
    --ok: #16a34a;
    --warn: #d97706;
    --danger: #dc2626;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: grid; grid-template-columns: 280px 1fr; height: 100vh; overflow: hidden;
  }
  body.side-collapsed { grid-template-columns: 0 1fr; }
  body.side-collapsed aside { opacity: 0; pointer-events: none; }
  @media (max-width: 900px) {
    /* 侧栏变成抽屉：脱离文档流后 grid 会把 main 排到第一列，
       所以窄屏直接改用 block 布局，main 自己占满宽度 */
    body { display: block; height: 100vh; }
    main { width: 100%; height: 100vh; }
    aside {
      position: fixed; z-index: 30; width: 280px; height: 100vh; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none;
    }
    body.side-open aside { opacity: 1; pointer-events: auto; }
  }
  button { font-family: inherit; }

  /* ---------- 侧栏 ---------- */
  aside {
    background: var(--bg-soft); display: flex; flex-direction: column;
    min-height: 0; overflow: hidden; transition: opacity .18s ease;
  }
  .side-top { display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px 14px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .logo {
    width: 26px; height: 26px; border-radius: 8px; background: var(--text); color: #fff;
    display: grid; place-items: center; flex: none;
  }
  .side-tools { margin-left: auto; display: flex; gap: 2px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--bg-soft2); color: var(--text); }

  .side-nav { padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 0; background: transparent; padding: 9px 10px; border-radius: 10px;
    font-size: 14px; color: var(--text2); cursor: pointer; position: relative;
  }
  .nav-item:hover { background: var(--bg-soft2); }
  .nav-item.active { background: #e7e7ea; color: var(--text); font-weight: 600; }
  .nav-ico { width: 20px; height: 20px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .nav-item.active .nav-ico { color: var(--text2); }

  .nav-wrap { position: relative; }
  .menu {
    position: absolute; top: calc(100% - 4px); left: 0; right: 0; z-index: 20;
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 6px;
  }
  .menu button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 8px 10px; border-radius: 8px; font-size: 13.5px; color: var(--text2); cursor: pointer;
  }
  .menu button:hover { background: var(--bg-soft2); color: var(--text); }
  .menu-info { padding: 8px 10px 4px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .menu-info code { color: var(--text2); word-break: break-all; }

  .side-list { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 10px 16px; }
  .list-h { font-size: 13px; font-weight: 600; color: var(--text2); padding: 10px 10px 6px; }
  .filter {
    width: 100%; margin: 4px 0 8px; padding: 7px 10px; font: inherit; font-size: 13px;
    border: 1px solid var(--border); border-radius: 9px; background: #fff; color: var(--text);
  }
  .filter:focus { outline: none; border-color: var(--border2); }
  .rec {
    display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent;
    padding: 8px 10px; border-radius: 9px; cursor: pointer; text-align: left;
  }
  .rec:hover { background: var(--bg-soft2); }
  .rec .t { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text2);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec .ts { flex: none; font-size: 12px; color: var(--muted); }
  .rec.on .t { color: var(--text); font-weight: 600; }
  .grp { font-size: 12px; color: var(--muted); padding: 12px 10px 4px; letter-spacing: .3px; }
  .empty { padding: 14px 10px; color: var(--muted); font-size: 13px; }

  .side-foot {
    border-top: 1px solid var(--border); padding: 10px 14px;
    font-size: 11.5px; color: var(--muted); line-height: 1.7;
  }
  .side-foot .ws { cursor: pointer; }
  .side-foot .ws:hover { color: var(--text2); }
  .side-foot .md { color: var(--muted); }

  /* ---------- 主区 ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .reopen {
    position: absolute; top: 14px; left: 14px; z-index: 15;
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border);
    background: #fff; color: var(--muted); cursor: pointer; display: none; place-items: center;
    box-shadow: var(--shadow);
  }
  body.side-collapsed .reopen { display: grid; }
  @media (max-width: 900px) { .reopen { display: grid; } }

  /* ---------- 首页 ---------- */
  .home { max-width: 820px; margin: 0 auto; padding: 46px 24px 28px; }
  .hero { margin: 0 0 20px; text-align: center; font-size: 32px; font-weight: 700; letter-spacing: -.4px; }
  .seg {
    display: flex; width: max-content; margin: 0 auto 26px; gap: 4px;
    padding: 4px; background: var(--bg-soft2); border-radius: 22px;
  }
  .seg-item {
    border: 0; background: transparent; padding: 7px 20px; border-radius: 18px;
    font-size: 14px; color: var(--text2); cursor: pointer;
  }
  .seg-item.active { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .chips { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .chips-scroll { display: flex; gap: 8px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; flex: 1; }
  .chips-scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--border); background: #fff; border-radius: 18px;
    padding: 7px 15px; font-size: 13.5px; color: var(--text2); cursor: pointer; white-space: nowrap;
  }
  .chip:hover { background: var(--bg-soft); border-color: var(--border2); }
  .chip.on { background: var(--text); border-color: var(--text); color: #fff; }
  .chip-scroll {
    flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
    background: #fff; color: var(--muted); cursor: pointer; display: grid; place-items: center;
  }
  .chip-scroll:hover { color: var(--text); border-color: var(--border2); }

  .composer {
    border: 1px solid var(--border); border-radius: var(--radius); background: #fff;
    box-shadow: var(--shadow); padding: 14px 16px 10px; position: relative;
  }
  .composer:focus-within { border-color: var(--border2); }

  /* ---------- 技能选择（输入 / 触发） ---------- */
  .skill-menu {
    position: absolute; left: 0; right: 0; z-index: 25;
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 6px; max-height: 300px; overflow-y: auto;
  }
  .skill-menu.up { bottom: calc(100% + 8px); }
  .skill-menu.down { top: calc(100% + 8px); }
  .skill-menu .hint-line {
    padding: 6px 10px 4px; font-size: 11.5px; color: var(--muted);
  }
  .skill-item {
    display: flex; flex-direction: column; gap: 2px; padding: 8px 10px;
    border-radius: 9px; cursor: pointer;
  }
  .skill-item:hover, .skill-item.on { background: var(--bg-soft2); }
  .skill-item .nm { font-size: 13.5px; font-weight: 600; color: var(--text); }
  .skill-item .nm code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; background: var(--bg-soft2); padding: 1px 6px;
    border-radius: 5px; margin-right: 6px;
  }
  .skill-item .ds {
    font-size: 12px; color: var(--muted); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .composer textarea {
    width: 100%; border: 0; outline: 0; resize: none; background: transparent;
    font: inherit; font-size: 15px; line-height: 1.65; color: var(--text);
    min-height: 54px; max-height: 200px; display: block;
  }
  .composer textarea::placeholder { color: #b3b3ba; }
  .composer-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .bar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .model-chip {
    font-size: 12px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 14px; padding: 3px 10px; white-space: nowrap;
  }
  .bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .send {
    width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--text);
    color: #fff; cursor: pointer; display: grid; place-items: center;
  }
  .send:disabled { opacity: .35; cursor: not-allowed; }

  .suggests { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 16px; }
  .sug {
    display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; font-size: 14.5px; color: var(--text);
    cursor: pointer; max-width: 430px; text-align: left;
  }
  .sug:hover { border-color: var(--border2); box-shadow: var(--shadow); }
  .sug .arw { margin-left: auto; color: var(--muted); flex: none; }
  .disclaimer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }

  /* ---------- 目录页（专家 / 技能） ---------- */
  .catalog-page { max-width: 1400px; margin: 0 auto; padding: 0 24px 40px; }
  .cat-body { display: flex; align-items: flex-start; gap: 20px; }
  .cat-main { flex: 1; min-width: 0; }
  .cat-top {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px;
    padding: 14px 0 12px; background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .cat-tabs { display: flex; gap: 4px; }
  .cat-tab {
    display: flex; align-items: center; gap: 6px; border: 0; background: transparent;
    padding: 7px 14px; border-radius: 9px; font-size: 14px; color: var(--muted); cursor: pointer;
  }
  .cat-tab:hover { background: var(--bg-soft); color: var(--text2); }
  .cat-tab.active { background: var(--bg-soft2); color: var(--text); font-weight: 600; }
  .cat-search { margin-left: auto; position: relative; }
  .cat-search input {
    width: 220px; padding: 7px 12px 7px 32px; font: inherit; font-size: 13.5px;
    border: 1px solid var(--border); border-radius: 9px; background: var(--bg-soft); color: var(--text);
  }
  .cat-search input:focus { outline: none; border-color: var(--border2); background: #fff; }
  .cat-search .ico {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; display: grid; place-items: center;
  }
  .cat-bar { display: flex; align-items: center; gap: 10px; padding: 14px 0 6px; }
  .cat-filters { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
  .cat-filters-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .cat-filters-scroll::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex: none; border: 1px solid transparent; background: transparent; border-radius: 16px;
    padding: 5px 13px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .cat-chip:hover { color: var(--text2); background: var(--bg-soft); }
  .cat-chip.on { background: var(--bg-soft2); color: var(--text); font-weight: 600; }
  .cat-sorts { display: flex; gap: 2px; flex: none; }
  .cat-sort {
    border: 0; background: transparent; padding: 5px 10px; border-radius: 8px;
    font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .cat-sort:hover { color: var(--text2); }
  .cat-sort.on { color: var(--text); font-weight: 600; background: var(--bg-soft2); }

  .cat-grid {
    display: grid; gap: 12px; margin-top: 12px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .cat-body.has-detail .cat-grid {
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }

  /* ---------- 详情面板 ---------- */
  .cat-detail {
    flex: none; width: 400px; position: sticky; top: 74px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: #fff; max-height: calc(100vh - 100px); overflow-y: auto;
  }
  @media (max-width: 1100px) {
    .cat-body { flex-direction: column; }
    .cat-detail { width: 100%; position: static; max-height: none; }
  }
  .dt-head {
    display: flex; gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
  }
  .dt-head .body { min-width: 0; }
  .dt-head .nm { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .dt-head .role { font-size: 12px; color: var(--muted); font-weight: 400; }
  .dt-head .ds { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  .dt-close {
    margin-left: auto; align-self: flex-start; width: 26px; height: 26px; border-radius: 8px;
    border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid;
    place-items: center; font-size: 15px; line-height: 1;
  }
  .dt-close:hover { background: var(--bg-soft2); color: var(--text); }
  .dt-sec { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .dt-sec:last-child { border-bottom: 0; }
  .dt-sec h4 {
    margin: 0 0 9px; font-size: 11.5px; font-weight: 600; color: var(--muted);
    letter-spacing: .6px; text-transform: uppercase;
  }
  .dt-kv { display: flex; flex-wrap: wrap; gap: 6px; }
  .dt-kv span {
    font-size: 12px; color: var(--text2); background: var(--bg-soft2);
    border-radius: 6px; padding: 2px 8px; display: inline-flex; align-items: center; gap: 4px;
  }
  .dt-kv span.hi { background: rgba(245,165,36,.14); color: #b45309; }
  .dt-kv span.hi::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--warn);
  }
  .dt-members { display: flex; flex-direction: column; gap: 8px; }
  .dt-member { display: flex; gap: 9px; align-items: flex-start; }
  .dt-member .av {
    width: 26px; height: 26px; border-radius: 8px; flex: none; color: #fff;
    display: grid; place-items: center; font-size: 12px; font-weight: 600;
  }
  .dt-member .nm { font-size: 13px; font-weight: 600; }
  .dt-member .nm .lead {
    font-size: 10.5px; color: var(--accent); background: var(--accent-soft);
    border-radius: 4px; padding: 1px 5px; margin-left: 5px; font-weight: 500;
  }
  .dt-member .rl { font-size: 11.5px; color: var(--muted); }
  .dt-pre {
    margin: 0; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 9px;
    padding: 11px 12px; font-size: 12px; line-height: 1.65; color: var(--text2);
    white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .dt-foot { padding: 14px 16px; display: flex; gap: 8px; }
  .dt-foot button {
    flex: 1; padding: 9px 12px; border-radius: 9px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text2);
  }
  .dt-foot button.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .dt-foot button:hover { border-color: var(--border2); }
  .dt-foot button.primary:hover { opacity: .88; }
  .dt-path { font-size: 11.5px; color: var(--muted); word-break: break-all; }
  .cat-card {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; cursor: pointer; display: flex; gap: 12px; transition: .15s;
  }
  .cat-card:hover { border-color: var(--border2); box-shadow: var(--shadow); }
  .cat-card.on { border-color: var(--accent); background: rgba(91,140,255,.05); }
  .cat-avatar {
    width: 44px; height: 44px; border-radius: 12px; flex: none; color: #fff;
    display: grid; place-items: center; font-size: 18px; font-weight: 600;
  }
  .cat-card .body { min-width: 0; flex: 1; }
  .cat-card .nm { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .cat-card .nm .role { font-size: 12px; color: var(--muted); font-weight: 400; }
  .cat-card .ds {
    color: var(--muted); font-size: 12.5px; margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cat-card .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .cat-card .tags span {
    font-size: 11.5px; color: var(--text2); background: var(--bg-soft2);
    border-radius: 5px; padding: 1px 7px;
  }
  .cat-card .foot {
    margin-top: 10px; font-size: 11.5px; color: var(--muted);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .cat-card .foot .warn { color: var(--warn); }
  .cat-empty { padding: 60px 0; text-align: center; color: var(--muted); font-size: 13.5px; }

  /* ---------- 对话 ---------- */
  .chat { max-width: 820px; margin: 0 auto; padding: 18px 24px 8px; }
  .chat-head {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .chat-head .inner {
    max-width: 820px; margin: 0 auto; padding: 10px 24px;
    display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted);
  }
  .chat-head b { color: var(--text); font-weight: 600; }
  .chat-head .tag {
    margin-left: auto; border: 1px solid var(--border); border-radius: 14px;
    padding: 2px 10px; font-size: 12px; color: var(--text2);
  }
  .msg { margin: 0 0 16px; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .bubble {
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; white-space: pre-wrap; word-break: break-word;
  }
  .bubble.user {
    background: var(--bg-soft2); border-color: transparent; margin-left: auto;
    width: fit-content; max-width: 78%;
  }
  .bubble.error { border-color: #f3c6c8; background: #fff6f6; color: #9f1239; }

  .steps { display: flex; flex-direction: column; gap: 6px; margin: 0 0 16px; }
  .step {
    display: flex; align-items: center; gap: 10px; border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; background: #fff; font-size: 13px;
  }
  .step .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .step.running .dot { background: var(--accent); animation: pulse 1.1s infinite; }
  .step.done .dot { background: var(--ok); }
  .step.failed .dot { background: var(--danger); }
  .step.waiting .dot { background: var(--warn); }
  .step .nm { font-weight: 600; flex: none; }
  .step .ds { flex: 1; min-width: 0; color: var(--text2); font-size: 12.5px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .st { flex: none; color: var(--muted); font-size: 12px; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .approval {
    margin: 0 0 16px; border: 1px solid #f0dcb4; border-left: 3px solid var(--warn);
    background: #fffaf0; border-radius: 12px; padding: 14px 16px;
  }
  .approval .t { font-weight: 700; color: var(--warn); margin-bottom: 8px; }
  .approval pre {
    margin: 8px 0 12px; background: #fff; border: 1px solid var(--border);
    border-radius: 9px; padding: 10px; font-size: 12px; overflow-x: auto;
    max-height: 220px; white-space: pre-wrap; word-break: break-all;
  }
  .approval .row { display: flex; gap: 9px; }
  button.primary { background: var(--text); color: #fff; border: 0; padding: 7px 16px;
                   border-radius: 8px; font-weight: 600; cursor: pointer; }
  button.danger { background: #fff; color: var(--danger); border: 1px solid #f3c6c8;
                  padding: 7px 16px; border-radius: 8px; cursor: pointer; }

  .dock { border-top: 1px solid var(--border); background: #fff; padding: 12px 24px 16px; }
  .dock .composer { max-width: 820px; margin: 0 auto; }
  .dock .composer textarea { min-height: 40px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 9px 16px; border-radius: 10px;
    font-size: 13px; z-index: 60; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .toast.on { opacity: 1; }
</style>
</head>

              <path d="M2 5h12M2 11h12" /><circle cx="6" cy="5" r="1.7" /><circle cx="10" cy="11" r="1.7" />

      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="1.5" y="2.5" width="13" height="11" rx="2" /><path d="M6.5 2.5v11" />
      </svg>
    </button>

    <div class="scroll" id="scroll">
      <section class="catalog-page" id="catalogPage" hidden>
        <div class="cat-top">
          <div class="cat-tabs" id="catTabs">
            <button class="cat-tab active" data-tab="teams">专家团</button>
            <button class="cat-tab" data-tab="experts">专家</button>
            <button class="cat-tab" data-tab="skills">技能</button>
          </div>
          <div class="cat-search">
            <span class="ico">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                <circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" />

      <section class="home" id="home">
        <h1 class="hero">CodeAssistant，我帮你</h1>

        <div class="seg" id="seg">

<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
const composer = $("composer");

let target = { expert: null, team: null };
let mode = "expert";          // 分段控件：expert | team
let busy = false;
let catalog = { experts: [], teams: [], skills: [] };
let health = {};
let page = "home";            // 主区域当前页：home | chat | catalog
let catTab = "teams";         // 目录页分页：teams | experts | skills
let catFilter = "全部";
let catSort = "all";          // all | hot | recent
let catQuery = "";
let sessions = [];            // 服务端会话列表
let currentSessionId = null;  // 当前对话的会话 ID
const steps = new Map();

/* ---------- 基础工具 ---------- */
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}
function scrollBottom() {
  const box = $("scroll");
  box.scrollTop = box.scrollHeight;
}
function shortPath(p) {
  const s = String(p || "");
  const parts = s.split("/").filter(Boolean);
  if (parts.length <= 2) return s;
  return "…/" + parts.slice(-2).join("/");
}
function fmtTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60e3) return "刚刚";
  if (diff < 3600e3) return Math.floor(diff / 60e3) + "分钟前";
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + "小时前";
  if (diff < 7 * 86400e3) return Math.floor(diff / 86400e3) + "天前";
  const d = new Date(ts);
  return (d.getMonth() + 1) + "月" + d.getDate() + "日";
}

/* ---------- 会话记录（服务端持久化） ---------- */
async function loadSessions() {
  try {
    const data = await (await fetch("/api/sessions")).json();
    sessions = data.sessions || [];
  } catch (e) {
    sessions = [];
  }
  renderSideList();
  if (page === "catalog") renderCatalog();
}

/** 拉回某个会话的完整对话记录，并把当前上下文切到它。 */
async function openSession(id) {
  let data;
  try {
    data = await (await fetch("/api/sessions/" + encodeURIComponent(id))).json();
  } catch (e) {
    toast("拉取会话记录失败");
    return;
  }
  log.innerHTML = "";
  steps.clear();
  currentSessionId = data.id || id;
  (data.turns || []).forEach(turn => {
    if (turn.role === "user") addMessage("你", turn.text, "user");
    else addMessage(turn.label || (turn.role === "team" ? "专家团" : "专家"), turn.text);
  });

  target = { expert: data.expert || null, team: data.team || null };
  if (target.expert) selectExpert(target.expert);
  else if (target.team) selectTeam(target.team);
  else {
    mode = "expert";
    syncSeg();
    $("targetName").textContent = "自动路由";
    $("targetTag").textContent = "自动路由";
    renderChips();
  }

  enterChat();
  renderSideList();
  scrollBottom();
  $("input").focus();
}

/* ---------- 侧栏 ---------- */
function renderSideList() {
  const box = $("sideList");
  box.innerHTML = "";

  box.appendChild(el("div", "list-h", "最近"));
  if (!sessions.length) {
    box.appendChild(el("div", "empty", "还没有会话记录"));
    return;
  }
  sessions.forEach(item => {
    const b = el("button", "rec" + (item.id === currentSessionId ? " on" : ""));
    const turns = item.turns || 0;
    b.innerHTML = `<span class="t">${esc(item.title)}</span><span class="ts">${esc(fmtTime(item.updated_at * 1000))}</span>`;
    b.title = `${item.title}（${turns} 条记录）`;
    b.onclick = () => openSession(item.id);
    box.appendChild(b);
  });
}

/* ---------- 目录页（右侧展示专家 / 专家团 / 技能） ---------- */
const AVATAR_COLORS = ["#5b8cff", "#7c5cff", "#0ea5a4", "#e07a3f", "#d2455a", "#3f8ae0", "#8a6d3f"];

function avatarColor(seed) {
  let hash = 0;
  const text = String(seed || "");
  for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}

/** 某个专家 / 专家团被用过多少次（从会话记录里数）。 */
function usageCount(kind, name) {
  return sessions.filter(s => (kind === "team" ? s.team : s.expert) === name).length;
}

function catalogItems(tab) {
  if (tab === "teams") {
    return catalog.teams.map(t => ({
      kind: "team",
      name: t.name,
      title: t.display_name || t.name,
      role: t.mode === "parallel" ? "并行协作" : "主理人调度",
      desc: t.description || "",
      tags: t.member_names || t.members || [],
      foot: [
        `${(t.members || []).length} 位成员`,
        t.lead ? "主理人 " + displayNameOf(t.lead) : "",
      ],
      hitl: [],
    }));
  }
  if (tab === "experts") {
    return catalog.experts.map(e => ({
      kind: "expert",
      name: e.name,
      title: e.display_name || e.name,
      role: e.profession || "",
      desc: e.description || "",
      tags: e.tags || [],
      foot: [
        `${(e.tools || []).length} 个工具`,
        (e.skills || []).length ? `${e.skills.length} 个技能` : "",
        (e.hitl || []).length ? `${e.hitl.length} 个审批点` : "",
      ],
      hitl: e.hitl || [],
      builtin: e.source === "builtin",
    }));
  }
  return catalog.skills.map(s => ({
    kind: "skill",
    name: s.name,
    title: s.name,
    role: s.source === "global" ? "全局技能" : "包内技能",
    desc: s.description || "",
    tags: (s.agents || []).length ? s.agents : (s.default ? ["所有专家"] : ["通用型专家"]),
    foot: [
      (s.scripts || []).length
        ? `脚本：${s.scripts.slice(0, 3).join("、")}${s.scripts.length > 3 ? ` 等 ${s.scripts.length} 个` : ""}`
        : "",
      s.default ? "绑定所有专家" : "",
    ],
    hitl: [],
  }));
}

function catalogFilters(tab, items) {
  if (tab === "teams") {
    const modes = [...new Set(items.map(i => i.role))];
    return ["全部", ...modes];
  }
  if (tab === "experts") {
    const tags = [...new Set(items.flatMap(i => i.tags))];
    return ["全部", ...tags];
  }
  const roles = [...new Set(items.map(i => i.role))];
  return ["全部", ...roles];
}

function renderCatalog() {
  const tab = catTab;
  const all = catalogItems(tab);
  const kw = catQuery.toLowerCase();

  let items = all.filter(item =>
    !kw ||
    item.name.toLowerCase().includes(kw) ||
    item.title.toLowerCase().includes(kw) ||
    item.desc.toLowerCase().includes(kw) ||
    item.tags.some(t => t.toLowerCase().includes(kw))
  );

  // 筛选条
  const filters = catalogFilters(tab, all);
  const fbox = $("catFilters");
  fbox.innerHTML = "";
  filters.forEach(name => {
    const b = el("button", "cat-chip" + (name === catFilter ? " on" : ""));
    b.textContent = name;
    b.onclick = () => { catFilter = name; renderCatalog(); };
    fbox.appendChild(b);
  });
  if (catFilter && catFilter !== "全部") {
    items = items.filter(item =>
      tab === "teams" ? item.role === catFilter : item.tags.includes(catFilter)
    );
  }

  // 排序
  if (catSort === "hot") {
    items = items.slice().sort((a, b) => usageCount(a.kind, a.name) - usageCount(b.kind, b.name)).reverse();
  } else if (catSort === "recent") {
    const lastUsed = {};
    sessions.forEach(s => {
      [s.expert, s.team].forEach(n => {
        if (n) lastUsed[n] = Math.max(lastUsed[n] || 0, s.updated_at || 0);
      });
    });
    items = items.slice().sort((a, b) => (lastUsed[b.name] || 0) - (lastUsed[a.name] || 0));
  }

  // 卡片
  const grid = $("catGrid");
  grid.innerHTML = "";
  if (!items.length) {
    grid.appendChild(el("div", "cat-empty", "没有匹配的" + (tab === "teams" ? "专家团" : tab === "experts" ? "专家" : "技能")));
    return;
  }
  items.forEach(item => {
    const card = el("div", "cat-card");
    const selected = item.kind === "team" ? target.team === item.name : target.expert === item.name;
    if (selected) card.classList.add("on");
    const foot = (item.foot || []).filter(Boolean);
    card.innerHTML =
      `<div class="cat-avatar" style="background:${avatarColor(item.name)}">${esc(item.title.slice(0, 1))}</div>` +
      `<div class="body">` +
        `<div class="nm">${esc(item.title)}<span class="role">${esc(item.role)}</span></div>` +
        `<div class="ds">${esc(item.desc)}</div>` +
        (item.tags.length ? `<div class="tags">${item.tags.slice(0, 4).map(t => `<span>${esc(t)}</span>`).join("")}</div>` : "") +
        (foot.length ? `<div class="foot">${foot.map(f => `<span>${esc(f)}</span>`).join("")}</div>` : "") +
      `</div>`;
    card.onclick = () => pickFromCatalog(item);
    grid.appendChild(card);
  });
}

function pickFromCatalog(item) {
  openDetail(item.kind, item.name);
}

/* ---------- 详情面板 ---------- */
function detailEndpoint(kind, name) {
  if (kind === "team") return "/api/teams/" + encodeURIComponent(name);
  if (kind === "skill") return "/api/skills/" + encodeURIComponent(name);
  return "/api/experts/" + encodeURIComponent(name);
}

async function openDetail(kind, name) {
  const panel = $("catDetail");
  panel.hidden = false;
  $("catBody").classList.add("has-detail");
  panel.innerHTML = '<div class="dt-sec"><div class="empty">加载中…</div></div>';
  let data;
  try {
    const resp = await fetch(detailEndpoint(kind, name));
    if (!resp.ok) throw new Error("加载失败");
    data = await resp.json();
  } catch (e) {
    panel.innerHTML = '<div class="dt-sec"><div class="empty">详情加载失败</div></div>';
    return;
  }
  renderDetail(data);
}

function closeDetail() {
  $("catDetail").hidden = true;
  $("catBody").classList.remove("has-detail");
}

function detailSection(title, node) {
  const sec = el("div", "dt-sec");
  sec.appendChild(el("h4", null, title));
  sec.appendChild(node);
  return sec;
}

function renderDetail(data) {
  const panel = $("catDetail");
  panel.innerHTML = "";

  // 头部
  const head = el("div", "dt-head");
  const role = data.kind === "team"
    ? (data.mode === "parallel" ? "并行协作" : "主理人调度")
    : data.kind === "skill"
      ? (data.source === "global" ? "全局技能" : "包内技能")
      : (data.profession || "");
  head.innerHTML =
    `<div class="cat-avatar" style="background:${avatarColor(data.name)}">${esc(
      (data.display_name || data.name).slice(0, 1)
    )}</div>` +
    `<div class="body">` +
      `<div class="nm">${esc(data.display_name || data.name)}<span class="role">${esc(role)}</span></div>` +
      (data.description ? `<div class="ds">${esc(data.description)}</div>` : "") +
    `</div>`;
  const close = el("button", "dt-close", "✕");
  close.onclick = closeDetail;
  head.appendChild(close);
  panel.appendChild(head);

  if (data.kind === "expert") {
    if ((data.tags || []).length) {
      const box = el("div", "dt-kv");
      data.tags.forEach(t => box.appendChild(el("span", null, esc(t))));
      panel.appendChild(detailSection("标签", box));
    }
    if ((data.tools || []).length) {
      const box = el("div", "dt-kv");
      data.tools.forEach(tool => {
        const chip = el("span", tool.requires_approval ? "hi" : null, esc(tool.name));
        box.appendChild(chip);
      });
      panel.appendChild(detailSection(`工具（${data.tools.length}）`, box));
    }
    if ((data.hitl || []).length) {
      const box = el("div", "dt-kv");
      data.hitl.forEach(t => box.appendChild(el("span", "hi", esc(t))));
      panel.appendChild(detailSection(`需要人工审批（${data.hitl.length}）`, box));
    }
    if ((data.skills || []).length) {
      const box = el("div", "dt-kv");
      data.skills.forEach(s => box.appendChild(el("span", null, esc(s))));
      panel.appendChild(detailSection(`绑定技能（${data.skills.length}）`, box));
    }
    if (data.system_prompt) {
      const pre = el("pre", "dt-pre", esc(data.system_prompt));
      panel.appendChild(detailSection("系统提示词", pre));
    }
  }

  if (data.kind === "team") {
    const list = el("div", "dt-members");
    (data.members || []).forEach(m => {
      const row = el("div", "dt-member");
      row.innerHTML =
        `<span class="av" style="background:${avatarColor(m.name)}">${esc((m.display_name || m.name).slice(0, 1))}</span>` +
        `<span><span class="nm">${esc(m.display_name || m.name)}${m.is_lead ? '<span class="lead">主理人</span>' : ""}</span>` +
        `<span class="rl">${esc(m.profession || "")}</span></span>`;
      list.appendChild(row);
    });
    panel.appendChild(detailSection(`成员（${(data.members || []).length}）`, list));
  }

  if (data.kind === "skill") {
    const box = el("div", "dt-kv");
    if (data.default) box.appendChild(el("span", null, "绑定所有专家"));
    (data.agents || []).forEach(a => box.appendChild(el("span", null, esc(a))));
    panel.appendChild(detailSection("绑定范围", box));

    if ((data.scripts || []).length) {
      const sbox = el("div", "dt-kv");
      data.scripts.forEach(s => sbox.appendChild(el("span", null, esc("scripts/" + s))));
      panel.appendChild(detailSection(`脚本（${data.scripts.length}）`, sbox));
    }
    if ((data.references || []).length) {
      const rbox = el("div", "dt-kv");
      data.references.forEach(s => rbox.appendChild(el("span", null, esc("references/" + s))));
      panel.appendChild(detailSection(`参考资料（${data.references.length}）`, rbox));
    }
    if (data.instructions) {
      const pre = el("pre", "dt-pre", esc(data.instructions));
      panel.appendChild(detailSection("技能说明", pre));
    }
    if (data.path) {
      panel.appendChild(detailSection("来源文件", el("div", "dt-path", esc(data.path))));
    }
  }

  // 底部操作
  const foot = el("div", "dt-foot");
  if (data.kind === "skill") {
    const use = el("button", "primary", "在任务中调用");
    use.onclick = () => {
      $("input").value = "/" + data.name + " ";
      autosize();
      closeDetail();
      showPage("home");
      $("input").focus();
      toast("已填入 /" + data.name + "，补上任务即可发送");
    };
    foot.appendChild(use);
  } else {
    const use = el("button", "primary", data.kind === "team" ? "用这个专家团开始任务" : "用这个专家开始任务");
    use.onclick = () => {
      if (data.kind === "team") selectTeam(data.name);
      else selectExpert(data.name);
      closeDetail();
      if (!hasChat()) showPage("home");
      $("input").focus();
      toast("已选定 " + (data.display_name || data.name));
    };
    foot.appendChild(use);
  }
  panel.appendChild(foot);
}

/** 右侧主区域有三个页面：首页 / 对话 / 目录。 */
function showPage(name) {
  page = name;
  $("home").hidden = name !== "home";
  $("chat").hidden = name !== "chat";
  $("catalogPage").hidden = name !== "catalog";
  $("dock").hidden = name !== "chat";
  $("catalogBtn").classList.toggle("active", name === "catalog");
  $("newTaskBtn").classList.toggle("active", name === "home" && !hasChat());
}

function hasChat() { return !$("chat").hidden; }

/* ---------- 首页 ---------- */
const SUGGESTS = {
  expert: [
    "帮我梳理一下这个项目的整体结构",
    "看看最近改动的代码有没有问题",
    "给这个模块补上单元测试",
    "排查一下这里为什么这么慢",
  ],
  team: [
    "我们打算做一个新的 SaaS 产品，请给出完整方案",
    "线上服务出现异常，请定位根因并给出修复方案",
    "为这个项目补齐文档与交付物",
    "按需求、架构、前后端、测试分工把这件事做完",
  ],
};

function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  const items = mode === "team" ? catalog.teams : catalog.experts;
  items.forEach(item => {
    const b = el("button", "chip");
    b.textContent = item.display_name || item.name;
    const on = mode === "team" ? target.team === item.name : target.expert === item.name;
    if (on) b.classList.add("on");
    b.onclick = () => (mode === "team" ? selectTeam(item.name) : selectExpert(item.name));
    box.appendChild(b);
  });
  if (!items.length) {
    box.appendChild(el("div", "empty", mode === "team" ? "还没有专家团" : "还没有专家"));
  }
}

function renderSuggests() {
  const box = $("suggests");
  box.innerHTML = "";
  (SUGGESTS[mode] || []).forEach(text => {
    const b = el("button", "sug");
    b.innerHTML = `<span>${esc(text)}</span>
      <span class="arw">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 11 11 5M6 5h5v5" />
        </svg>
      </span>`;
    b.onclick = () => {
      $("input").value = text;
      autosize();
      $("input").focus();
    };
    box.appendChild(b);
  });
}

function enterChat() {
  showPage("chat");
  $("dockComposer").appendChild(composer);
  $("newTaskBtn").classList.remove("active");
}

function newTask() {
  showPage("home");
  $("homeComposer").appendChild(composer);
  log.innerHTML = "";
  steps.clear();
  currentSessionId = null;
  target = { expert: null, team: null };
  mode = "expert";
  syncSeg();
  $("targetName").textContent = "自动路由";
  $("targetTag").textContent = "自动路由";
  renderChips();
  renderSideList();
  $("input").focus();
}

/* ---------- 目标选择 ---------- */
function displayNameOf(name) {
  const hit = [...catalog.teams, ...catalog.experts].find(x => x.name === name);
  return hit ? (hit.display_name || hit.name) : name;
}
function selectExpert(name) {
  target = { expert: name, team: null };
  mode = "expert";
  syncSeg();
  renderChips();
  renderSideList();
  if (page === "catalog") renderCatalog();
  $("targetName").textContent = displayNameOf(name);
  $("targetTag").textContent = "专家";
}
function selectTeam(name) {
  target = { expert: null, team: name };
  mode = "team";
  syncSeg();
  renderChips();
  renderSideList();
  if (page === "catalog") renderCatalog();
  $("targetName").textContent = displayNameOf(name);
  $("targetTag").textContent = "专家团";
}
function syncSeg() {
  [...$("seg").children].forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
}

/* ---------- 对话渲染 ---------- */
function addMessage(who, text, cls) {
  const wrap = el("div", "msg");
  wrap.appendChild(el("div", "who", esc(who)));
  wrap.appendChild(el("div", "bubble " + (cls || ""), esc(text)));
  log.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function stepEl(name) {
  let row = steps.get(name);
  if (row) return row;
  row = el("div", "step");
  row.innerHTML = `<span class="dot"></span><span class="nm"></span><span class="ds"></span><span class="st"></span>`;
  log.appendChild(row);
  steps.set(name, row);
  scrollBottom();
  return row;
}

function updateStep(name, status, detail) {
  const row = stepEl(name);
  row.className = "step " + status;
  row.querySelector(".nm").textContent = name;
  row.querySelector(".ds").textContent = detail.text || "";
  row.querySelector(".st").textContent = detail.label || "";
  scrollBottom();
}

function showApproval(ev) {
  const box = el("div", "approval");
  box.innerHTML = `<div class="t">🔒 需要人工审批 · ${esc(ev.expert || "")}</div>
    <div>工具：<b>${esc(ev.tool)}</b>　风险：${esc(ev.risk || "high")}</div>
    ${ev.reason ? `<div style="color:var(--muted);margin-top:4px">${esc(ev.reason)}</div>` : ""}
    <pre>${esc(JSON.stringify(ev.args || {}, null, 2))}</pre>`;
  const row = el("div", "row");
  const ok = el("button", "primary", "允许执行");
  const no = el("button", "danger", "拒绝");
  row.appendChild(ok); row.appendChild(no);
  box.appendChild(row);
  log.appendChild(box);
  scrollBottom();

  const decide = async (approved, reason) => {
    ok.disabled = no.disabled = true;
    await fetch("/api/approvals", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ request_id: ev.request_id, approved, reason })
    });
    box.querySelector(".t").textContent = approved ? "✅ 已允许执行" : "🚫 已拒绝";
  };
  ok.onclick = () => decide(true, "Web 界面确认");
  no.onclick = () => decide(false, "Web 界面拒绝");
}

function handleEvent(ev) {
  const p = ev.payload || {};
  switch (ev.type) {
    case "run_started":
      // 服务端分配（或沿用）会话 ID，后续消息都挂在这个会话上
      currentSessionId = p.session_id || currentSessionId;
      break;
    case "orchestrator_route":
      $("targetName").textContent = p.target ? displayNameOf(p.target) : "自动路由";
      $("targetTag").textContent = p.route === "team" ? "专家团" : "专家";
      break;
    case "expert_plan":
      updateStep(ev.expert, "running", { label: "规划中", text: (p.text || "").slice(0, 160) });
      break;
    case "expert_tool_call":
      updateStep(ev.expert, "running", { label: p.tool || "调用工具", text: JSON.stringify(p.args || {}).slice(0, 120) });
      break;
    case "expert_tool_result":
      updateStep(ev.expert, "running", { label: "工具返回", text: String(p.text || "").slice(0, 160) });
      break;
    case "expert_completed":
      updateStep(ev.expert, p.status === "failed" ? "failed" : "done", { label: p.status || "完成", text: String(p.text || "").slice(0, 200) });
      break;
    case "team_dispatch":
      updateStep(ev.team, "running", { label: `第 ${p.round} 轮 → ${p.member}`, text: p.reason || "" });
      updateStep(p.member, "waiting", { label: "被派活", text: p.reason || "" });
      break;
    case "team_completed":
      updateStep(ev.team, p.status === "failed" ? "failed" : "done", { label: "团队完成", text: String(p.text || "").slice(0, 200) });
      break;
    case "approval_required":
      showApproval(ev);
      break;
    case "run_completed":
      addMessage("最终结论", p.text || "", p.status === "failed" ? "error" : "");
      break;
    case "error":
      addMessage("错误", p.message || "未知错误", "error");
      break;
  }
}

/* ---------- 发送 ---------- */
async function send() {
  const text = $("input").value.trim();
  if (!text || busy) return;
  busy = true;
  $("sendBtn").disabled = true;
  $("input").value = "";
  autosize();
  enterChat();
  addMessage("你", text, "user");

  const body = {
    task: text,
    session_id: currentSessionId,
    expert: target.expert,
    team: target.team,
    mode: null,
  };

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try { handleEvent(JSON.parse(payload)); } catch (e) { console.error(e); }
      }
    }
  } catch (err) {
    addMessage("错误", String(err), "error");
  } finally {
    busy = false;
    $("sendBtn").disabled = false;
    $("input").focus();
    loadSessions();
  }
}

function autosize() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
}

let toastTimer = null;
function toast(text) {
  const box = $("toast");
  box.textContent = text;
  box.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove("on"), 2200);
}

/* ---------- 技能选择（输入 / 触发） ---------- */
let skillItems = [];   // 当前菜单里的技能
let skillIndex = 0;    // 高亮项

/** 找出光标前正在输入的「/命令」。 */
function skillCommandAt() {
  const t = $("input");
  const upto = t.value.slice(0, t.selectionStart);
  const slash = upto.lastIndexOf("/");
  if (slash < 0) return null;
  // "/" 前面不能是别的字符（否则多半是路径）
  const before = slash === 0 ? "" : upto[slash - 1];
  if (before && !/\s/.test(before)) return null;
  const query = upto.slice(slash + 1);
  if (/\s/.test(query)) return null;   // 后面已经有空格 → 不是在输入命令
  return { query, start: slash };
}

/** 当前目标能用的技能（其余的列出来但标灰，避免选了没反应）。 */
function skillIsBound(skill) {
  if (target.expert) {
    const expert = catalog.experts.find(e => e.name === target.expert);
    if (!expert) return true;
    if (skill.default) return true;
    if ((skill.agents || []).length) return skill.agents.includes(target.expert);
    return true;
  }
  if (target.team) {
    const team = catalog.teams.find(t => t.name === target.team);
    const members = team ? team.members : [];
    if (skill.default) return true;
    if ((skill.agents || []).length) return skill.agents.some(a => members.includes(a));
    return true;
  }
  return true;
}

function openSkillMenu(query) {
  const box = $("skillMenu");
  const kw = query.toLowerCase();
  skillItems = (catalog.skills || []).filter(s =>
    !kw || s.name.toLowerCase().includes(kw) || (s.description || "").toLowerCase().includes(kw)
  );
  if (!skillItems.length) {
    closeSkillMenu();
    return;
  }
  skillIndex = 0;
  renderSkillMenu(query);
  box.hidden = false;
  positionSkillMenu();
}

/** 菜单贴着输入框展开：上面放得下就朝上，否则朝下。 */
function positionSkillMenu() {
  const box = $("skillMenu");
  const rect = $("composer").getBoundingClientRect();
  const above = rect.top;
  const below = window.innerHeight - rect.bottom;
  if (above >= below) {
    box.classList.add("up");
    box.classList.remove("down");
    box.style.maxHeight = Math.max(140, Math.min(300, above - 16)) + "px";
  } else {
    box.classList.add("down");
    box.classList.remove("up");
    box.style.maxHeight = Math.max(140, Math.min(300, below - 16)) + "px";
  }
}

function renderSkillMenu(query) {
  const box = $("skillMenu");
  box.innerHTML = "";
  box.appendChild(el("div", "hint-line",
    query ? `技能 · 匹配「${query}」` : "技能 · 选择一个带进任务（↑↓ 选择，Enter 确认，Esc 关闭）"));
  skillItems.forEach((skill, i) => {
    const item = el("div", "skill-item" + (i === skillIndex ? " on" : ""));
    const bound = skillIsBound(skill);
    item.innerHTML =
      `<span class="nm"><code>/${esc(skill.name)}</code>${esc(skill.description || "")}` +
      `${bound ? "" : "　<span style='color:var(--warn)'>当前专家未绑定</span>"}</span>` +
      `<span class="ds">${esc(
        (skill.agents || []).length ? "绑定：" + skill.agents.join("、") :
        skill.default ? "所有专家" : "通用型专家"
      )}</span>`;
    item.onclick = () => applySkill(skill);
    item.onmouseenter = () => {
      skillIndex = i;
      [...box.querySelectorAll(".skill-item")].forEach((n, j) => n.classList.toggle("on", j === i));
    };
    box.appendChild(item);
  });
}

function closeSkillMenu() {
  $("skillMenu").hidden = true;
  skillItems = [];
  skillIndex = 0;
}

function applySkill(skill) {
  const t = $("input");
  const hit = skillCommandAt();
  const start = hit ? hit.start : t.selectionStart;
  const end = t.selectionStart;
  const token = "/" + skill.name + " ";
  t.value = t.value.slice(0, start) + token + t.value.slice(end);
  const pos = start + token.length;
  t.setSelectionRange(pos, pos);
  closeSkillMenu();
  t.focus();
  autosize();
}

function moveSkillCursor(delta) {
  if (!skillItems.length) return;
  skillIndex = (skillIndex + delta + skillItems.length) % skillItems.length;
  const box = $("skillMenu");
  [...box.querySelectorAll(".skill-item")].forEach((n, i) => n.classList.toggle("on", i === skillIndex));
  const active = box.querySelector(".skill-item.on");
  if (active) active.scrollIntoView({ block: "nearest" });
}

function syncSkillMenu() {
  const hit = skillCommandAt();
  if (!hit) { closeSkillMenu(); return; }
  openSkillMenu(hit.query);
}

/* ---------- 数据加载 ---------- */
async function loadCatalog() {
  catalog = await (await fetch("/api/catalog")).json();
  renderChips();
  renderSideList();
  if (page === "catalog") renderCatalog();
}

async function loadHealth() {
  try {
    health = await (await fetch("/api/health")).json();
    $("modelLine").textContent = `${health.provider} / ${health.model}`;
    $("wsPath").textContent = "工作区 " + shortPath(health.workspace);
    $("wsPath").title = health.workspace || "";
    const chip = document.querySelector(".model-chip");
    if (chip) chip.textContent = `${health.provider} / ${health.model}`;
    $("menuInfo").innerHTML =
      `模型　${esc(health.provider)} / ${esc(health.model)}<br>工作区　<code>${esc(health.workspace || "")}</code>`;
  } catch (e) {
    $("modelLine").textContent = "后端未连接";
  }
}

/* ---------- 事件绑定 ---------- */
$("sendBtn").onclick = send;
$("input").addEventListener("keydown", (e) => {
  // 技能菜单开着时，方向键/回车归菜单管
  if (!$("skillMenu").hidden && skillItems.length) {
    if (e.key === "ArrowDown") { e.preventDefault(); moveSkillCursor(1); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); moveSkillCursor(-1); return; }
    if (e.key === "Enter" || e.key === "Tab") {
      e.preventDefault();
      applySkill(skillItems[skillIndex]);
      return;
    }
    if (e.key === "Escape") { e.preventDefault(); closeSkillMenu(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", () => { autosize(); syncSkillMenu(); });
$("input").addEventListener("click", syncSkillMenu);
$("input").addEventListener("blur", () => setTimeout(closeSkillMenu, 120));

$("newTaskBtn").onclick = () => newTask();
$("catalogBtn").onclick = () => {
  if (page === "catalog") { showPage(hasChat() ? "chat" : "home"); return; }
  showPage("catalog");
  renderCatalog();
};
$("searchBtn").onclick = () => {
  showPage("catalog");
  renderCatalog();
  $("catSearch").focus();
};
$("collapseBtn").onclick = () => {
  if (window.matchMedia("(max-width: 900px)").matches) {
    document.body.classList.remove("side-open");
  } else {
    document.body.classList.add("side-collapsed");
  }
};
$("reopenBtn").onclick = () => {
  if (window.matchMedia("(max-width: 900px)").matches) {
    document.body.classList.add("side-open");
  } else {
    document.body.classList.remove("side-collapsed");
  }
};
$("attachBtn").onclick = () => {
  catTab = "skills";
  showPage("catalog");
  renderCatalog();
};

$("catTabs").onclick = (e) => {
  const btn = e.target.closest(".cat-tab");
  if (!btn) return;
  catTab = btn.dataset.tab;
  catFilter = "全部";
  [...$("catTabs").children].forEach(b => b.classList.toggle("active", b === btn));
  closeDetail();
  renderCatalog();
};
$("catSearch").addEventListener("input", (e) => {
  catQuery = e.target.value.trim();
  renderCatalog();
});
$("catSorts").onclick = (e) => {
  const btn = e.target.closest(".cat-sort");
  if (!btn) return;
  catSort = btn.dataset.sort;
  [...$("catSorts").children].forEach(b => b.classList.toggle("active", b === btn));

};
$("catFilterNext").onclick = () => {
  const sc = $("catFilters");
  sc.scrollBy({ left: sc.clientWidth * 0.8, behavior: "smooth" });
};

$("moreBtn").onclick = (e) => {
  e.stopPropagation();
  const menu = $("moreMenu");
  menu.hidden = !menu.hidden;
};
document.addEventListener("click", () => { $("moreMenu").hidden = true; });
$("moreMenu").onclick = async (e) => {
  const act = e.target.dataset ? e.target.dataset.act : null;
  if (!act) return;
  e.stopPropagation();
  $("moreMenu").hidden = true;
  if (act === "reload") {
    const r = await (await fetch("/api/reload", { method: "POST" })).json();
    await loadCatalog();
    toast("已热重载专家包：" + (r.summary || ""));
  } else if (act === "copy-ws") {
    try { await navigator.clipboard.writeText(health.workspace || ""); } catch (err) {}
    toast("工作区路径已复制");
  }
};

$("seg").onclick = (e) => {
  const btn = e.target.closest(".seg-item");
  if (!btn) return;
  mode = btn.dataset.mode;
  syncSeg();
  renderChips();
  renderSuggests();
};

$("chipNext").onclick = () => {
  const sc = $("chips");
  sc.scrollBy({ left: sc.clientWidth * 0.8, behavior: "smooth" });
};

$("wsPath").onclick = async () => {
  try {
    await navigator.clipboard.writeText(health.workspace || "");
    toast("工作区路径已复制");
  } catch (e) {}
};

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("moreMenu").hidden = true;
});

/* ---------- 启动 ---------- */
renderSuggests();
loadHealth();
loadCatalog();
loadSessions();
renderSideList();
$("input").focus();
</script>
