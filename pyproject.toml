[project]
name = "codeassistant"
version = "0.1.0"
description = "基于 LangGraph 的多专家代码助手：专家 / 专家团 / 主编排器三层架构"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.7,<2",
    "langchain>=1.4,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.9",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.7"]
anthropic = ["langchain-anthropic>=1.7"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sse-starlette>=2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
all = [
    "langchain-openai>=1.7",
    "langchain-anthropic>=1.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2",
]

[project.scripts]
codeassistant = "codeassistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeassistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
